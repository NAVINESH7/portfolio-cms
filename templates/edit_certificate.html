<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Certificate</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-950 text-white min-h-screen">

<div class="max-w-4xl mx-auto p-8">

<div class="flex justify-between items-center mb-10">

<h1 class="text-5xl font-bold text-cyan-400">
Edit Certificate
</h1>

<a
href="/certificates"
class="bg-slate-800 px-5 py-3 rounded-xl"
>
Back
</a>

</div>

<form
method="POST"
enctype="multipart/form-data"
class="bg-slate-900 p-8 rounded-2xl"
>

<div class="mb-6">

<label class="block mb-2">
Certificate Name
</label>

<input
type="text"
name="title"
value="{{ certificate.title }}"
required
class="w-full bg-slate-800 p-4 rounded-xl"
>

</div>

<div class="mb-6">

<label class="block mb-2">
Description
</label>

<textarea
name="description"
required
class="w-full bg-slate-800 p-4 rounded-xl h-32"
>{{ certificate.description }}</textarea>

</div>

<div class="mb-6">

<label class="block mb-2">
Upload New Certificate
</label>

<input
type="file"
name="file"
accept=".jpg,.jpeg,.png,.pdf"
class="w-full bg-slate-800 p-4 rounded-xl"
>

</div>

{% if certificate.file %}

<div class="mb-6">

<a
href="{{ url_for('static', filename=certificate.file) }}"
target="_blank"
class="bg-green-500 text-black px-4 py-2 rounded-xl font-bold"
>
View Current Certificate
</a>

</div>

{% endif %}

<button
type="submit"
class="bg-cyan-500 text-black px-6 py-3 rounded-xl font-bold"
>
Save Changes
</button>

</form>

</div>

</body>

</html>
