<!DOCTYPE html>
<html>
<head>
<title>Edit Soft Skill</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<div class="max-w-3xl mx-auto p-8">

<h1 class="text-4xl font-bold text-cyan-400 mb-8">
Edit Soft Skill
</h1>

<form method="POST">

<input
type="text"
name="name"
value="{{ skill.skill }}"
required
class="w-full bg-slate-900 p-4 rounded-xl mb-6"
>

<button
type="submit"
class="bg-cyan-500 text-black px-6 py-3 rounded-xl font-bold"
>
Save Changes
</button>

</form>

</div>

</body>
</html>
