<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#020617;

font-family:Arial;

overflow:hidden;

}

.grid-bg{

position:absolute;

width:100%;
height:100%;

background-image:
linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);

background-size:40px 40px;

z-index:-1;

}

.glass{

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(14px);

}

.input-box{

background:black;

border:1px solid rgba(34,211,238,0.15);

color:white;

outline:none;

}

</style>

</head>

<body>

<div class="grid-bg"></div>

<form
method="POST"
class="glass p-14 rounded-[35px] w-[430px]"
>

<h1 class="text-5xl font-bold text-cyan-400 mb-10 text-center">

Admin Login

</h1>

<input
type="text"
name="username"
placeholder="Username"
required
class="w-full input-box p-5 rounded-2xl mb-6"
>

<input
type="password"
name="password"
placeholder="Password"
required
class="w-full input-box p-5 rounded-2xl mb-10"
>

<button
class="w-full bg-cyan-400 text-black p-5 rounded-2xl font-bold text-xl"
>
Login
</button>

<a
href="/"
class="block text-center mt-4 text-cyan-400 text-lg font-semibold hover:text-cyan-300 transition duration-300"
>
← Back Home
</a>

</form>

</body>
</html>
