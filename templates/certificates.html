<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates CMS</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#020617;
}

.card{
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

</style>

</head>

<body class="text-white min-h-screen">

<div class="max-w-7xl mx-auto p-8">

    <!-- HEADER -->

    <div class="flex justify-between items-center mb-10">

        <h1 class="text-5xl font-bold text-cyan-400">
            Certificates CMS
        </h1>

        <a
        href="/admin"
        class="bg-slate-800 hover:bg-slate-700 px-6 py-3 rounded-xl font-bold"
        >
            Back
        </a>

    </div>

    <!-- ADD CERTIFICATE -->

    <form
    action="/add-certificate"
    method="POST"
    enctype="multipart/form-data"
    class="bg-slate-900 p-6 rounded-2xl mb-8"
    >

        <div class="grid md:grid-cols-2 gap-4">

            <input
            type="text"
            name="title"
            placeholder="Certificate Name"
            required
            class="bg-slate-800 p-4 rounded-xl outline-none"
            >

            <textarea
            name="description"
            placeholder="Certificate Description"
            required
            class="bg-slate-800 p-4 rounded-xl outline-none h-28"
            ></textarea>

            <input
            type="file"
            name="file"
            accept=".jpg,.jpeg,.png,.pdf"
            required
            class="bg-slate-800 p-4 rounded-xl"
            >

            <button
            type="submit"
            class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-xl"
            >
                + Add Certificate
            </button>

        </div>

    </form>

    <!-- TOTAL -->

    <div class="bg-slate-900 rounded-2xl p-6 mb-8">

        <p class="text-gray-400">
            Total Certificates
        </p>

        <h2 class="text-5xl font-bold text-cyan-400 mt-2">
            {{ certificates|length }}
        </h2>

    </div>
<!-- CERTIFICATES -->

<div class="grid md:grid-cols-2 gap-6">

    {% for certificate in certificates %}

    <div class="bg-slate-900 p-6 rounded-2xl card">

        {% if certificate.image_url %}

        <img
            src="{{ certificate.image_url }}"
            class="w-full h-56 object-cover rounded-xl mb-4"
            alt="{{ certificate.title }}"
        >

        {% endif %}

        <h2 class="text-2xl font-bold text-cyan-400 mb-3">
            {{ certificate.title }}
        </h2>

        <p class="text-gray-400 mb-5">
            {{ certificate.description }}
        </p>

        <div class="flex flex-wrap gap-3">

            {% if certificate.image_url %}

            <a
                href="{{ certificate.image_url }}"
                target="_blank"
                class="bg-green-500 hover:bg-green-400 text-black px-4 py-2 rounded-lg font-bold"
            >
                View
            </a>

            {% endif %}

            <a
                href="/edit-certificate/{{ certificate.id }}"
                class="bg-yellow-500 hover:bg-yellow-400 text-black px-4 py-2 rounded-lg font-bold"
            >
                Edit
            </a>

            <a
                href="/delete-certificate/{{ certificate.id }}"
                onclick="return confirm('Delete this certificate?')"
                class="bg-red-500 hover:bg-red-400 px-4 py-2 rounded-lg font-bold"
            >
                Delete
            </a>

        </div>

    </div>

    {% endfor %}

</div>

</div>

</body>

</html>
