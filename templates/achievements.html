<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-950 text-white p-10">

<div class="max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-10">

        <h1 class="text-5xl font-bold text-cyan-400">
            Achievements
        </h1>

        <a
        href="/admin"
        class="bg-cyan-500 px-6 py-3 rounded-xl font-bold text-black">
            Back
        </a>

    </div>

    <!-- ADD ACHIEVEMENT FORM -->

    <div class="bg-slate-900 p-8 rounded-2xl mb-10">

        <form method="POST" action="/add-achievement">

            <input
            type="text"
            name="title"
            placeholder="Achievement Title"
            class="w-full p-4 rounded-xl bg-slate-800 mb-4"
            required>

            <textarea
            name="description"
            placeholder="Achievement Description"
            class="w-full p-4 rounded-xl bg-slate-800 mb-4"
            rows="5"
            required></textarea>

            <button
            type="submit"
            class="bg-cyan-500 text-black px-6 py-3 rounded-xl font-bold">
                Add Achievement
            </button>

        </form>

    </div>

    <!-- SAVED ACHIEVEMENTS -->

    <h2 class="text-3xl font-bold text-cyan-400 mb-6">
        Saved Achievements
    </h2>

    {% if achievements %}

        {% for achievement in achievements %}

        <div class="bg-slate-900 p-6 rounded-2xl mb-4">

            <h3 class="text-2xl font-bold text-cyan-400">
                {{ achievement.title }}
            </h3>

            <p class="mt-3 text-gray-300">
                {{ achievement.description }}
            </p>

            <div class="mt-4 flex gap-3">

                <a
                href="/edit-achievement/{{ loop.index0 }}"
                class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold">
                    Edit
                </a>

                <a
                href="/delete-achievement/{{ loop.index0 }}"
                class="bg-red-500 px-4 py-2 rounded-lg font-bold">
                    Delete
                </a>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="bg-slate-900 p-6 rounded-2xl">

            <p class="text-gray-400">
                No achievements added yet.
            </p>

        </div>

    {% endif %}

</div>

</body>
</html>
