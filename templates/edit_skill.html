<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Skill</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#020617;
color:white;
font-family:Arial;
}

.glass{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
}

.input-box{
background:black;
border:1px solid rgba(34,211,238,0.15);
outline:none;
color:white;
}

.input-box:focus{
border:1px solid #22d3ee;
}

</style>

</head>

<body class="p-6 md:p-10">

<div class="max-w-3xl mx-auto">

<div class="glass rounded-3xl p-8">

<h1 class="text-4xl font-bold text-cyan-400 mb-8">

Edit Skill

</h1>

<form method="POST">

<input
type="text"
name="name"
value="{{ skill.name }}"
required
class="w-full input-box p-5 rounded-2xl mb-6"
>

<input
type="number"
name="level"
value="{{ skill.level }}"
required
class="w-full input-box p-5 rounded-2xl mb-6"
>

<div class="flex gap-4">

<button
class="bg-cyan-400 text-black px-8 py-4 rounded-2xl font-bold"
>

Save Skill

</button>

<a
href="/admin"
class="bg-red-500 px-8 py-4 rounded-2xl font-bold"
>

Cancel

</a>

</div>

</form>

</div>

</div>

</body>

</html>
