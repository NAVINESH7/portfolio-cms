<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>{{ project.title }}</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#020617;
color:white;
font-family:Arial;
}

.glass{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
}

</style>

</head>

<body class="p-6 md:p-10">

<div class="max-w-6xl mx-auto">

<a
href="/"
class="inline-block bg-cyan-400 text-black px-6 py-3 rounded-xl font-bold mb-8"
>

Back

</a>

<div class="glass rounded-3xl p-8 md:p-12">

<h1 class="text-4xl md:text-6xl font-bold text-cyan-400 mb-8">

{{ project.title }}

</h1>

<p class="text-gray-400 text-lg mb-4">

Category: {{ project.category }}

</p>

<p class="text-gray-400 text-lg mb-8">

Year: {{ project.year }}

</p>

<div class="flex flex-wrap gap-3 mb-10">

{% for tech in project.tech_stack %}

<span
class="bg-cyan-500/10 text-cyan-400 px-4 py-2 rounded-xl font-bold"
>

{{ tech }}

</span>

{% endfor %}

</div>

<h2 class="text-2xl md:text-3xl font-bold text-cyan-400 mb-6">

Project Description

</h2>

<p class="text-xl text-gray-300 leading-relaxed mb-12">

{{ project.full_description }}

</p>

{% if project.gallery %}

<h2 class="text-3xl font-bold text-cyan-400 mb-8">

Gallery

</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

{% for image in project.gallery %}

<img
    src="{{ image }}"
    onclick="openImage('{{ image }}')"
    class="rounded-2xl w-full hover:scale-105 transition duration-300 cursor-pointer"
    loading="lazy"
    alt="{{ project.title }}"
>

{% endfor %}

</div>

{% endif %}

</div>

</div>

<div
    id="lightbox"
    class="fixed inset-0 bg-black/95 hidden items-center justify-center z-50"
    onclick="closeImage()"
>

<button
    onclick="event.stopPropagation(); prevImage();"
    class="absolute left-6 top-1/2 -translate-y-1/2 z-[60] bg-black/70 rounded-full w-16 h-16 flex items-center justify-center text-white text-4xl font-bold"
>
    &#10094;
</button>

<img
    id="lightbox-image"
    class="max-w-[80%] max-h-[80vh] object-contain rounded-2xl"
    onclick="event.stopPropagation()"
>

<button
    onclick="event.stopPropagation(); nextImage();"
    class="absolute right-6 top-1/2 -translate-y-1/2 z-[60] bg-black/70 rounded-full w-16 h-16 flex items-center justify-center text-white text-4xl font-bold"
>
    &#10095;
</button>

    <button
        onclick="event.stopPropagation(); closeImage();"
        class="absolute top-4 right-6 text-white text-5xl"
    >
        &times;
    </button>

    <div
        id="image-counter"
        class="absolute bottom-6 text-white text-lg"
    >
    </div>

</div>

<script>

const galleryImages = [
{% for image in project.gallery %}
"{{ image }}",
{% endfor %}
];

let currentImageIndex = 0;

function openImage(imageUrl)
{
    currentImageIndex = galleryImages.indexOf(imageUrl);

    document.getElementById("lightbox-image").src = imageUrl;

    updateCounter();

    document.getElementById("lightbox")
        .classList.remove("hidden");

    document.getElementById("lightbox")
        .classList.add("flex");
}

function closeImage()
{
    document.getElementById("lightbox")
        .classList.remove("flex");

    document.getElementById("lightbox")
        .classList.add("hidden");
}

function nextImage()
{
    currentImageIndex++;

    if(currentImageIndex >= galleryImages.length)
    {
        currentImageIndex = 0;
    }

    document.getElementById("lightbox-image").src =
        galleryImages[currentImageIndex];

    updateCounter();
}

function prevImage()
{
    currentImageIndex--;

    if(currentImageIndex < 0)
    {
        currentImageIndex =
            galleryImages.length - 1;
    }

    document.getElementById("lightbox-image").src =
        galleryImages[currentImageIndex];

    updateCounter();
}

function updateCounter()
{
    document.getElementById("image-counter").innerText =
        (currentImageIndex + 1) +
        " / " +
        galleryImages.length;
}

document.addEventListener(
    "keydown",
    function(event)
    {
        if(event.key === "ArrowRight")
        {
            nextImage();
        }

        if(event.key === "ArrowLeft")
        {
            prevImage();
        }

        if(event.key === "Escape")
        {
            closeImage();
        }
    }
);

let touchStartX = 0;

document.getElementById("lightbox")
.addEventListener(
    "touchstart",
    function(e)
    {
        touchStartX =
            e.changedTouches[0].screenX;
    }
);

document.getElementById("lightbox")
.addEventListener(
    "touchend",
    function(e)
    {
        let touchEndX =
            e.changedTouches[0].screenX;

        if(touchEndX < touchStartX - 50)
        {
            nextImage();
        }

        if(touchEndX > touchStartX + 50)
        {
            prevImage();
        }
    }
);

</script>

</body>

</html>
