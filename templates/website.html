<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Settings</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-950 text-white min-h-screen">

<div class="max-w-6xl mx-auto p-8">

<div class="flex justify-between items-center mb-10">

<h1 class="text-4xl font-bold text-cyan-400">
Website Settings
</h1>

<a href="/admin"
class="bg-slate-800 px-5 py-3 rounded-xl">
Back
</a>

</div>

<div class="bg-slate-900 rounded-2xl p-8">

<form
action="/update-settings"
method="POST"
class="space-y-5"
>

<input
type="text"
name="hero_title"
placeholder="Hero Title"
value="{{ settings.hero_title }}"
class="w-full bg-slate-800 p-4 rounded-xl"
>

<input
type="text"
name="hero_subtitle"
placeholder="Hero Subtitle"
value="{{ settings.hero_subtitle }}"
class="w-full bg-slate-800 p-4 rounded-xl"
>

<textarea
name="about_text"
rows="6"
placeholder="About Text"
class="w-full bg-slate-800 p-4 rounded-xl"
>{{ settings.about_text }}</textarea>

<input
type="email"
name="email"
placeholder="Email"
value="{{ settings.email }}"
class="w-full bg-slate-800 p-4 rounded-xl"
>

<input
type="text"
name="phone"
placeholder="Phone Number"
value="{{ settings.phone }}"
class="w-full bg-slate-800 p-4 rounded-xl"
>

<input
type="text"
name="github"
placeholder="GitHub URL"
value="{{ settings.github }}"
class="w-full bg-slate-800 p-4 rounded-xl"
>

<input
type="text"
name="linkedin"
placeholder="LinkedIn URL"
value="{{ settings.linkedin }}"
class="w-full bg-slate-800 p-4 rounded-xl"
>

<button
type="submit"
class="bg-cyan-500 text-black px-8 py-4 rounded-xl font-bold"
>

Save Settings

</button>

</form>

</div>

</div>

</body>
</html>
